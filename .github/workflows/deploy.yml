name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH to Server and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Остановка и удаление старого контейнера (если он существует)
            sudo docker stop myapp-container || true
            sudo docker rm myapp-container || true
          
            # Сборка нового образа из Dockerfile
            sudo docker build -t myapp:latest .
          
            # Запуск нового контейнера из собранного образа
            sudo docker run -d --name myapp-container -p 8080:8080 -p 8081:8081 myapp:latest

