name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start SSH Agent and Add Key
        run: |
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          ssh-add key.pem <<< "${{ secrets.SSH_PASSPHRASE }}"

      - name: SSH to Server and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker stop myapp-container || true
            sudo docker rm myapp-container || true
            sudo docker pull myrepo/myapp:latest
            sudo docker run -d --name myapp-container -p 8080:8080 -p 8081:8081 myrepo/myapp:latest
