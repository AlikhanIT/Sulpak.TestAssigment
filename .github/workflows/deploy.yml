name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      # Step 1: Connect to Server and Prepare Repository
      - name: Connect and Prepare Repository
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Set project directory
            PROJECT_DIR=~/Sulpak.TestAssigment

            # Проверка существования директории
            if [ -d "$PROJECT_DIR/.git" ]; then
              echo "Repository exists. Performing git pull..."
              cd $PROJECT_DIR
              git checkout test
              git pull origin test
            else
              echo "Repository does not exist. Cloning..."
              rm -rf $PROJECT_DIR || true
              git clone -b test https://github.com/AlikhanIT/Sulpak.TestAssigment.git $PROJECT_DIR
            fi

      # Step 2: Stop Existing Container
      - name: Stop Existing Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Stopping and removing existing container..."
            sudo docker stop myapp-container || true
            sudo docker rm myapp-container || true

      # Step 3: Build Docker Image
      - name: Build Docker Image
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            PROJECT_DIR=~/Sulpak.TestAssigment
            cd $PROJECT_DIR

            echo "Building Docker image..."
            sudo docker build -t myapp .

      # Step 4: Run Docker Container
      - name: Run Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Running the new container..."
            sudo docker run -d --name myapp-container -p 8080:8080 -p 8081:8081 myapp --urls http://0.0.0.0:8080

      # Step 5: Confirmation
      - name: Deployment Confirmation
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deployment completed successfully!"
