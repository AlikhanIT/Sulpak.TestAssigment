name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонирование репозитория
      - name: Checkout Code
        uses: actions/checkout@v4

      # Шаг 2: Копирование файлов на сервер
      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"
          target: "~/myapp-directory"
          strip-components: 0

      # Шаг 3: Проверка файлов на сервере
      - name: Check Files on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "### Проверка директории ~/myapp-directory ###"
            ls -R ~/myapp-directory

      # Шаг 4: Сборка и деплой
      - name: Build and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/myapp-directory
            if [ ! -f ./Sulpak.TestAssigment.PublicApi/Dockerfile ]; then
              echo "Error: Dockerfile not found in Sulpak.TestAssigment.PublicApi!"
              exit 1
            fi

            sudo docker stop myapp-container || true
            sudo docker rm myapp-container || true
            sudo docker build -t myapp ./Sulpak.TestAssigment.PublicApi/
            sudo docker run -d --name myapp-container -p 8080:8080 -p 8081:8081 myapp

            echo "Deployment completed successfully!"
