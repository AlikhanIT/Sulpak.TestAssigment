name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Подключение по SSH, клонирование репозитория и сборка
      - name: Clone Repository and Build Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Очистка старой директории
            rm -rf ~/myapp-directory || true

            # Клонирование текущего репозитория
            echo "Cloning the repository..."
            git clone https://github.com/AlikhanIT/Sulpak.TestAssigment.git ~/myapp-directory

            # Переход в директорию и проверка Dockerfile
            cd Sulpak.TestAssigment.PublicApi

            # Остановка старого контейнера
            echo "Stopping existing container..."
            sudo docker stop myapp-container || true
            sudo docker rm myapp-container || true

            # Сборка и запуск нового контейнера
            echo "Building Docker image..."
            sudo docker build -t myapp .

            echo "Running the new container..."
            sudo docker run -d --name myapp-container -p 8080:8080 -p 8081:8081 myapp

            echo "Deployment completed successfully!"
